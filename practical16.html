
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>

<body>

    <h1>Student Marks Calculator</h1>

    <label>Student Name:</label>
    <input type="text" id="name">

    <br><br>

    <label>Entrepreneurship:</label>
    <input type="number" id="m1" min="0" max="100">

    <br><br>

    <label>Mathematics:</label>
    <input type="number" id="m2" min="0" max="100">

    <br><br>

    <label>AOC:</label>
    <input type="number" id="m3" min="0" max="100">

    <br><br>

    <label>PP1:</label>
    <input type="number" id="m4" min="0" max="100">

    <br><br>

    <label>BWD:</label>
    <input type="number" id="m5" min="0" max="100">

    <br><br>

    <label>ES:</label>
    <input type="number" id="m6" min="0" max="100">

    <br><br>

    <button onclick="calculate()">Calculate Result</button>

    <h2 id="result"></h2>

    <script>

        function calculate() {

            let name = document.getElementById("name").value;

            let marks = [
                Number(document.getElementById("m1").value),
                Number(document.getElementById("m2").value),
                Number(document.getElementById("m3").value),
                Number(document.getElementById("m4").value),
                Number(document.getElementById("m5").value),
                Number(document.getElementById("m6").value)
            ];

            if (name.trim() === "" ||
                marks.some(m => m < 0 || m > 100 ||
                document.getElementById("m1").value === "")) {

                document.getElementById("result").innerHTML =
                "Please enter valid details.";

                return;
            }

            let total = marks.reduce((a, b) => a + b, 0);

            let percentage = total / 6;

            let grade;

            if (percentage >= 80)
                grade = "A";
            else if (percentage >= 60)
                grade = "B";
            else if (percentage >= 40)
                grade = "C";
            else
                grade = "Fail";

            if (marks.some(m => m < 35)) {
                grade = "Fail";
            }

            document.getElementById("result").innerHTML =
                "Student Name: " + name +
                "<br>Total Marks: " + total + " / 600" +
                "<br>Percentage: " + percentage.toFixed(2) + "%" +
                "<br>Grade: " + grade;
        }

    </script>

</body>
</html>
